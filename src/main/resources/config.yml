# Treb3rAntiCheater Configuration
# Hardened Anti-ESP & Anti-Xray engine for Paper 1.21.x

# ==========================================
# 1. Anti-ESP & Occlusion Culling
# ==========================================

# Radius in blocks around player to check entities (entities beyond this are automatically occluded)
max-tracking-distance: 48.0

# Distance in blocks under which targets bypass wall checks (0.0 = strict occlusion even point-blank)
near-distance: 0.0

# Number of tick slices (1 = every tick 100% real-time, 2 = 50% CPU load)
time-slices: 1

# Respect vanilla glowing mechanics (spectral arrows, bells, glow potions)
bypass-on-glowing: true

# Ticks both attacker and victim remain mutually visible after a hit (30 ticks = 1.5s)
combat-grace-ticks: 30

# Entities to cull through walls
hide-players: true
hide-monsters: true
hide-animals: false
hide-misc: true

# ==========================================
# 2. Packet-Level Anti-Xray Engine
# ==========================================
anti-xray:
  # Enable packet-level ore obfuscation directly in memory
  enabled: true

  # Engine Mode:
  # 1 = Hide covered ores as stone / deepslate / netherrack
  # 2 = Obfuscate with random fake ores (blinds X-Ray & Freecam cheats with noise)
  engine-mode: 2

  # Obscure ores beneath lava pools
  lava-obscures: true

  # Block radius around mined blocks to update and reveal legitimate ores
  update-radius: 2

  # List of worlds where Anti-Xray is disabled (empty by default = protects all worlds)
  excluded-worlds: []

# ==========================================
# 3. Anti-Freecam Protection
# ==========================================
anti-freecam:
  # Enable protection against Freecam exploits (base/mine scouting & remote clicking)
  enabled: true

  # Block opening containers, breaking blocks, and damaging entities through solid walls
  prevent-interact-through-walls: true

  # Maximum physical interaction reach from player's eye location in blocks
  max-reach-distance: 5.2

